name: CI/CD

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    name: Python CI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Install tooling
        run: python -m pip install --upgrade pip-tools==7.6.1 pip-audit==2.10.1

      - name: Verify lock file pins are current
        # 只比對「套件==版本」有沒有跟 requirements.in 對齊(抓忘記重新產生
        # 這種真正的 drift),刻意不比對雜湊清單本身——已發布版本的 wheel
        # 清單會被上游持續追加(同版本號、新雜湊),逐字比對雜湊會被這種
        # 上游變動觸發假警報,而不是抓到真正的問題。
        run: |
          python -m piptools compile --cache-dir .pip-tools-cache --strip-extras --no-header --output-file /tmp/requirements.fresh.lock requirements.in
          diff <(grep -E '^[A-Za-z0-9_.-]+==' requirements.lock | awk '{print $1}' | sort) \
               <(grep -E '^[A-Za-z0-9_.-]+==' /tmp/requirements.fresh.lock | awk '{print $1}' | sort)

      - name: Install locked dependencies
        run: python -m pip install --require-hashes -r requirements.lock

      - name: Check dependency consistency
        run: python -m pip check

      - name: Audit locked dependencies
        run: python -m pip_audit --cache-dir .pip-audit-cache -r requirements.lock

      - name: Compile Python files
        run: python -m py_compile app/*.py

      - name: Run tests
        run: python -m pytest -q

  docker:
    name: Build And Publish Image
    runs-on: ubuntu-latest
    needs: ci
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Compute image tags
        id: image
        shell: bash
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          image="ghcr.io/${owner}/engops-api"
          short_sha="${GITHUB_SHA::12}"
          tags="${image}:sha-${short_sha}"

          if [[ "${GITHUB_REF_TYPE}" == "branch" && "${GITHUB_REF_NAME}" == "main" ]]; then
            tags="${tags}"$'\n'"${image}:main"
          fi

          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            tags="${tags}"$'\n'"${image}:${GITHUB_REF_NAME}"
          fi

          {
            echo "image=${image}"
            echo "tag=sha-${short_sha}"
            echo "tags<<EOF"
            echo "${tags}"
            echo "EOF"
          } >> "${GITHUB_OUTPUT}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.image.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Checkout GitOps repo
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
        uses: actions/checkout@v6
        with:
          # GITOPS_REPO 沒設 repo variable 時,預設用同一個 GitHub 帳號底下的
          # platform-gitops(跟這份 repo 同 owner),讓 fork 的人不用先設變數就能跑。
          repository: ${{ vars.GITOPS_REPO || format('{0}/platform-gitops', github.repository_owner) }}
          ref: main
          token: ${{ secrets.GITOPS_PUSH_TOKEN }}
          path: platform-gitops

      - name: Update GitOps image tag
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
        shell: bash
        env:
          IMAGE: ${{ steps.image.outputs.image }}:${{ steps.image.outputs.tag }}
        run: |
          set -euo pipefail

          file="platform-gitops/apps/engops-api/deployment.yaml"
          perl -0pi -e 's#image:\s*ghcr\.io/[^\s]+/engops-api:\S+#image: '"${IMAGE}"'#' "${file}"

          if ! grep -q "image: ${IMAGE}" "${file}"; then
            echo "Failed to update ${file}" >&2
            exit 1
          fi

          cd platform-gitops
          if git diff --quiet -- apps/engops-api/deployment.yaml; then
            echo "GitOps image already ${IMAGE}"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/engops-api/deployment.yaml
          git commit -m "Deploy engops-api ${GITHUB_SHA::12}"
          git push origin HEAD:main
