name: CI/CD

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    name: Python CI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Check dependency consistency
        run: python -m pip check

      - name: Compile Python files
        run: python -m py_compile app/*.py

      - name: Run tests
        run: python -m pytest -q

  docker:
    name: Build And Publish Image
    runs-on: ubuntu-latest
    needs: ci
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Compute image tags
        id: image
        shell: bash
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          image="ghcr.io/${owner}/engops-api"
          short_sha="${GITHUB_SHA::12}"
          tags="${image}:sha-${short_sha}"

          if [[ "${GITHUB_REF_TYPE}" == "branch" && "${GITHUB_REF_NAME}" == "main" ]]; then
            tags="${tags}"$'\n'"${image}:main"
          fi

          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            tags="${tags}"$'\n'"${image}:${GITHUB_REF_NAME}"
          fi

          {
            echo "image=${image}"
            echo "tag=sha-${short_sha}"
            echo "tags<<EOF"
            echo "${tags}"
            echo "EOF"
          } >> "${GITHUB_OUTPUT}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.image.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Checkout GitOps repo
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
        uses: actions/checkout@v6
        with:
          repository: A4225344A/platform-gitops
          ref: main
          token: ${{ secrets.GITOPS_PUSH_TOKEN }}
          path: platform-gitops

      - name: Update GitOps image tag
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
        shell: bash
        env:
          IMAGE: ${{ steps.image.outputs.image }}:${{ steps.image.outputs.tag }}
        run: |
          set -euo pipefail

          file="platform-gitops/apps/engops-api/deployment.yaml"
          perl -0pi -e 's#image:\s*ghcr\.io/[^\s]+/engops-api:\S+#image: '"${IMAGE}"'#' "${file}"

          if ! grep -q "image: ${IMAGE}" "${file}"; then
            echo "Failed to update ${file}" >&2
            exit 1
          fi

          cd platform-gitops
          if git diff --quiet -- apps/engops-api/deployment.yaml; then
            echo "GitOps image already ${IMAGE}"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/engops-api/deployment.yaml
          git commit -m "Deploy engops-api ${GITHUB_SHA::12}"
          git push origin HEAD:main
